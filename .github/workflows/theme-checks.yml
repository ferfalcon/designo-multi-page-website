name: Theme static checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check PHP syntax
        run: find web/wp-content/themes/designo -name '*.php' -print0 | xargs -0 -r -n 1 php -l
      - name: Check JavaScript syntax
        run: find web/wp-content/themes/designo -name '*.js' -print0 | xargs -0 -r -n 1 node --check
      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('web/wp-content/themes/designo').rglob('*.json'))
          assert files, 'No theme JSON files found'
          for path in files:
              json.loads(path.read_text())
              print(f'OK: {path}')
          PY
